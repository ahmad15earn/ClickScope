name: Build ClickScope
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ClickScope --icon assets/app.ico --add-data "assets;assets" --paths src src/main.py
      - name: Build installer (folder-choosing setup wizard)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\ClickScope.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ClickScope-Setup
          path: installer_output/ClickScope-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClickScope-Portable
          path: dist/ClickScope.exe
